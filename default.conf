location /path-to-s3/ {
    proxy_pass https://your-s3-bucket.s3.amazonaws.com/;
    
    # ⚠️ COGのストリーミング/Rangeリクエストを通すために必須
    proxy_buffering off;
    
    # クライアントからの Range ヘッダーをそのまま S3 にパススルーする
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    
    # S3 からの 206 Partial Content ヘッダーをそのままクライアントに返す
    proxy_pass_header Content-Range;
    proxy_pass_header Accept-Ranges;
}
